:root{--navy:#142f40;--teal:#087b70;--paper:#f7f7f2;--line:#dce3df;--muted:#526772;--orange:#ab4937}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #e3a633;outline-offset:4px}header{background:var(--navy);color:white;padding:22px max(24px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;font-size:20px;letter-spacing:.01em}.brand span{color:#8fdfcb;margin-right:12px}.header-note{font-size:14px;color:#c7d8dc}main{max-width:1200px;margin:0 auto;padding:38px 24px 64px}.intro{max-width:810px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-size:12px;font-weight:800;margin:0 0 10px}h1{font-size:clamp(30px,4vw,44px);line-height:1.13;letter-spacing:-.035em;margin:0 0 16px}p{margin:0 0 15px}.sub{color:var(--muted);font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 8px 32px #142f4005}.qtop{display:flex;justify-content:space-between;gap:16px;font-size:13px;font-weight:700;color:var(--teal);margin-bottom:20px}h2{font-size:24px;line-height:1.35;letter-spacing:-.015em;margin:0 0 23px}fieldset{margin:0;padding:0;border:0;min-width:0}legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.options{display:grid;gap:12px}.option{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s}.option:hover{background:#f4faf8;border-color:#91bfb6}.option:has(input:checked){background:#eaf7f2;border:2px solid var(--teal);padding:15px 17px}.option input{margin-top:6px;accent-color:var(--teal);width:17px;height:17px;flex-shrink:0}.letter{font-size:13px;font-weight:800;color:var(--muted);padding-top:3px}.option-text{flex:1}.bottom{margin-top:26px;padding-top:23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.btn{border:1px solid var(--line);border-radius:9px;padding:11px 19px;background:white;font-weight:650;color:var(--navy)}.btn:hover{background:#edf3f0}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#066459}.btn:disabled{opacity:.4;cursor:not-allowed}.aside-title{font-size:16px;margin:0 0 15px}.side{padding:23px}.progress{height:7px;background:#e6ece8;border-radius:9px;overflow:hidden;margin:14px 0 20px}.progress div{height:100%;background:var(--teal);transition:width .2s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.navq{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--navy);font-weight:650}.navq.done{background:#e0f2e9;color:#086555;border-color:#b6d9ca}.navq[aria-current=true]{outline:2px solid var(--teal);outline-offset:2px}.micro{font-size:13px;color:var(--muted);margin-top:15px}.side .btn{width:100%;margin-top:16px}.error{color:var(--orange);font-size:14px;margin:15px 0 0}details{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}summary{font-weight:650;cursor:pointer}details>div{padding-top:15px;color:var(--muted);font-size:15px}.data{margin:0 0 24px}.data h2{margin-bottom:12px}.data h3{font-size:19px;margin:0 0 12px}.data p{font-size:15px;color:var(--muted)}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}caption{text-align:left;font-weight:700;margin-bottom:8px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}th:first-child{text-align:left}thead{background:#edf2ef}footer{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted)}.results-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.score{font-size:56px;font-weight:800;letter-spacing:-.05em;color:var(--teal)}.score small{font-size:25px;color:var(--muted)}.review{margin:16px 0}.review h3{font-size:19px;margin:0 0 15px}.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:9px}.tag.wrong{color:var(--orange)}.answer-line{font-size:15px;margin-bottom:9px}.explain{border-top:1px solid var(--line);padding-top:15px;margin-top:15px;color:var(--muted);font-size:16px}.result-actions{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{order:2}.grid{grid-template-columns:repeat(7,1fr)}header{padding:18px 22px}.header-note{font-size:12px}main{padding-top:27px}.card{padding:23px}.qtop{margin-bottom:15px}h2{font-size:21px}footer{display:block}.score{font-size:48px}}@media(max-width:440px){main{padding-left:16px;padding-right:16px}.card{padding:19px}.option{padding:13px 12px;gap:10px}.option:has(input:checked){padding:12px 11px}.btn{padding:10px 13px}.grid{gap:7px}.bottom{gap:7px}}@media print{header,.intro,.aside,.data,.result-actions,footer{display:none}.card{box-shadow:none;break-inside:avoid}.results-head{display:block}main{padding:0}.review{border-radius:0}}
</style></head><body><header><div class="brand"><span>σ</span><span style="color:#c7d8dc;font-weight:400;margin-left:10px">Statistiques · QCM 2</span></div><div class="header-note">Master 2 NCC</div></header><main><div id="quiz" class="layout"><div><section class="data card" aria-label="Énoncé et données"><h2 id="statement-title" tabindex="-1">Énoncé</h2><p id="case-summary"></p><div id="case-data"></div></section><section id="question-card" class="card" aria-labelledby="question-title"></section></div><aside class="aside"><section class="card side"><h2 class="aside-title">Votre progression</h2><div id="answered" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="Questions répondues" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0"><div id="bar"></div></div><nav class="grid" id="question-nav" aria-label="Navigation entre les questions"></nav><p class="micro">Vous pouvez passer une question ou choisir « Je ne sais pas ». Une réponse absente vaut 0 point. Vous pouvez modifier vos choix avant l’envoi.</p><button id="finish" class="btn primary">Terminer et envoyer mes réponses</button><p id="message" class="error" role="status"></p></section></aside></div><section id="results" class="hidden" aria-labelledby="results-title"></section></main><script>
const questions=[{"id": 1, "exercise": 1, "theme": "Choix du test", "question": "L'analyse statistique des données devrait se faire en utilisant :", "options": ["La régression simple.", "L’analyse de la variance.", "Le test du χ².", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Les mêmes 10 patients sont évalués dans trois modalités. On compare leurs moyennes avec une ANOVA à mesures répétées."}, {"id": 2, "exercise": 1, "theme": "Calcul de F", "question": "La statistique de test est égale à :", "options": ["2,18", "39,13", "13,58", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Les moyennes sont 12,7, 8,6 et 4,0 omissions. SC effet = 378,87 ; CM effet = 378,87 / 2. CM erreur = 87,13 / 18. F = (378,87 / 2) / (87,13 / 18) ≈ 39,13."}, {"id": 3, "exercise": 1, "theme": "Degrés de liberté", "question": "Les degrés de liberté de la statistique de test sont :", "options": ["1 et 9", "2 et 9", "2 et 18", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Il y a 3 modalités et 10 patients. Les degrés de liberté sont 3 − 1 = 2 pour l’effet et (3 − 1) × (10 − 1) = 18 pour l’erreur."}, {"id": 4, "exercise": 1, "theme": "Interprétation", "question": "La probabilité de la statistique de test indique que :", "options": ["La variance inter - modalités est significativement supérieure à la variance d’erreur.", "La variance inter - modalités est significativement inférieure à la variance d’erreur.", "La variance d’erreur est significativement affectée par la variance inter - modalités.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "F(2, 18) = 39,13 est significatif au seuil de 5 %. Le carré moyen entre modalités est significativement supérieur au carré moyen d’erreur : au moins une moyenne diffère."}, {"id": 5, "exercise": 1, "theme": "Newman–Keuls", "question": "Les étendues critiques au test a posteriori de Newman – Keuls sont 2.07 et 2.52 pour les étapes 1 et 2 respectivement. Par conséquent, le test de Newman – Keuls révèle :", "options": ["Une différence non significative entre les modalités visuelle et auditive.", "Une différence non significative entre les modalités visuelle et tactile.", "Une différence non significative entre les modalités auditive et tactile.", "Aucune des réponses ci-dessus ne convient."], "answer": 3, "explanation": "Les écarts entre les moyennes sont 4,1 (visuel–auditif), 4,6 (auditif–tactile) et 8,7 (visuel–tactile). Les écarts adjacents dépassent 2,07 et l’écart extrême dépasse 2,52. Les trois différences sont significatives : aucune des propositions A, B ou C ne convient."}, {"id": 6, "exercise": 2, "theme": "Choix du test", "question": "L'analyse statistique des données devrait se faire en utilisant :", "options": ["La régression simple.", "L’analyse de la variance.", "Le test du χ².", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "On compare trois groupes de personnes distinctes sur une variable quantitative. Sous les hypothèses données, une ANOVA à groupes indépendants convient."}, {"id": 7, "exercise": 2, "theme": "Calcul de F", "question": "La statistique de test est égale à :", "options": ["2,18", "31,87", "13,58", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Les moyennes sont 12,7°, 8,6° et 4,0°. SC effet = 378,87 ; CM effet = 378,87 / 2. CM erreur = 160,50 / 27. F = (378,87 / 2) / (160,50 / 27) ≈ 31,87."}, {"id": 8, "exercise": 2, "theme": "Degrés de liberté", "question": "Les degrés de liberté de la statistique de test sont :", "options": ["1 et 9", "2 et 18", "2 et 27", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Pour 3 groupes et 30 participants, les degrés de liberté sont 3 − 1 = 2 pour l’effet et 30 − 3 = 27 pour l’erreur."}, {"id": 9, "exercise": 2, "theme": "Interprétation", "question": "La probabilité de la statistique de test indique que :", "options": ["La variance inter - modalités est significativement supérieure à la variance d’erreur.", "La variance inter - modalités est significativement inférieure à la variance d’erreur.", "La variance d’erreur est significativement affectée par la variance inter - modalités.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "F(2, 27) = 31,87 est significatif au seuil de 5 %. Le carré moyen entre groupes est significativement supérieur au carré moyen d’erreur : au moins une moyenne diffère."}, {"id": 10, "exercise": 2, "theme": "Newman–Keuls", "question": "Les étendues critiques au test a posteriori de Newman – Keuls sont 2.23 et 2.72 pour les étapes 1 et 2 respectivement. Par conséquent, le test de Newman – Keuls révèle :", "options": ["Une différence non significative entre les groupes des 20 – 30 ans et des 40 – 50 ans.", "Une différence non significative entre les groupes des 20 – 30 ans et des 60 – 70 ans.", "Une différence non significative entre les groupes des 40 – 50 ans et des 60 – 70 ans.", "Aucune des réponses ci-dessus ne convient."], "answer": 3, "explanation": "Les moyennes ordonnées sont 4,0°, 8,6° et 12,7°. Les écarts adjacents de 4,6° et 4,1° dépassent 2,23° ; l’écart extrême de 8,7° dépasse 2,72°. Toutes les paires diffèrent significativement."}, {"id": 11, "exercise": 3, "theme": "Régression", "question": "Le lien entre l’âge et le temps de détection, peut-être modélisé par la fonction :", "options": ["T = -1.95A + 70.12", "T = 0.18A + 2.33", "T = 2.95A + 65.25", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "La pente vaut Cov(A,T) / s²A ≈ 3,45 / 4,34² ≈ 0,18. Avec cette pente arrondie, l’ordonnée à l’origine vaut 14,41 − 0,18 × 67,12 ≈ 2,33. On obtient T ≈ 0,18A + 2,33. Sans arrondir la pente, les données donnent T ≈ 0,18285A + 2,13957."}, {"id": 12, "exercise": 3, "theme": "Corrélation", "question": "Le coefficient de corrélation entre l’âge et le temps de détection est environ égal à :", "options": ["0.85", "0.27", "0.90", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "r = Cov(A,T) / (sA × sT) ≈ 3,45 / (4,34 × 2,94) ≈ 0,27. Le lien linéaire observé est positif."}, {"id": 13, "exercise": 3, "theme": "Prédiction", "question": "Le modèle mathématique donné plus haut prédit qu’une personne âgée de 79 ans détectera le changement de température en environ :", "options": ["11.5 s", "16.6 s", "9.5 s", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "En remplaçant A par 79 dans T = 0,18A + 2,33, on obtient 16,55 s, soit environ 16,6 s. Le calcul sans arrondir les coefficients donne également environ 16,6 s."}, {"id": 14, "exercise": 3, "theme": "Erreur standard", "question": "L’erreur standard d’estimation associée à la droite de régression est environ égale à :", "options": ["2.92", "1.25", "0.55", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Pour 17 observations, l’erreur standard d’estimation est √[Σ(T − T prédit)² / (17 − 2)] ≈ 2,92 s."}, {"id": 15, "exercise": 3, "theme": "Choix du test", "question": "La statistique de test permettant de vérifier la signification du coefficient de corrélation est :", "options": ["le F de Fisher", "le χ²", "le t de Student", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Pour tester directement H₀ : ρ = 0, on utilise t = r × √[(n − 2) / (1 − r²)], avec n − 2 = 15 degrés de liberté. En régression simple, le test F équivalent utilise F = t²."}, {"id": 16, "exercise": 3, "theme": "Calcul du test t", "question": "La statistique de test permettant de vérifier la signification du coefficient de corrélation est environ égale à :", "options": ["- 9.25", "- 6.24", "- 21.78", "Aucune des réponses ci-dessus ne convient."], "answer": 3, "explanation": "Avec r ≈ 0,2703 et n = 17, t = 0,2703 × √[15 / (1 − 0,2703²)] ≈ +1,09. Aucune des trois valeurs négatives proposées ne convient."}];
const cases={"1": {"summary": "Exercice 1 · Héminégligence et modalités sensorielles.", "intro": "Des patients souffrant d’une lésion du cortex pariétal droit présentent généralement une incapacité à traiter des stimuli présentés dans l’hémi-champ controlatéral à la lésion. Des auteurs ont essayé de voir si cette héminégligence se manifestait de manière similaire dans la modalité tactile et la modalité auditive. Pour cela, ils ont relevé le nombre d’omissions d’un stimulus visuel, sonore ou tactile présenté dans l’hémi-champ controlatéral à la lésion de 10 patients héminégligents.", "rows": [["Stimulus visuel", 15, 16, 12, 10, 15, 14, 15, 10, 9, 11], ["Stimulus auditif", 10, 9, 10, 9, 8, 6, 12, 7, 5, 10], ["Stimulus tactile", 8, 6, 7, 3, 0, 3, 2, 6, 3, 2]], "caption": "Nombre d’omissions", "note": "On suppose la normalité de la distribution des scores et l’homogénéité des variances. SC intra = 87,13."}, "2": {"summary": "Exercice 2 · Vieillissement et aptitudes spatiales.", "intro": "Dans une étude sur l’effet du vieillissement sur les aptitudes spatiales, des chercheurs ont demandé à 10 personnes âgées de 20 à 30 ans, 10 personnes âgées de 40 à 50 ans et 10 personnes âgées de 60 à 70 ans d’indiquer la direction d’un point de repère après avoir parcouru un labyrinthe. L’examen des données révèle que leur distribution suit une loi normale et que les variances ne diffèrent pas significativement entre les groupes.", "rows": [["60–70 ans", 15, 16, 12, 10, 15, 14, 15, 10, 9, 11], ["40–50 ans", 10, 9, 10, 9, 8, 6, 12, 7, 5, 10], ["20–30 ans", 8, 6, 7, 3, 0, 3, 2, 6, 3, 2]], "caption": "Erreur en degrés d’angle", "note": "SC intra = 160,50."}, "3": {"summary": "Exercice 3 · Âge et sensibilité à un changement de température.", "intro": "Dans une étude visant à évaluer le lien entre l’âge et la sensibilité à un changement d’ambiance thermique, des chercheurs ont mesuré le temps de détection d’une augmentation de 5 °C de la température ambiante en chambre climatique.", "rows": [["Âge en années (A)", 66, 65, 62, 64, 72, 70, 63, 65, 68, 67, 62, 60, 71, 75, 74, 69, 68], ["Temps en secondes (T)", 13, 12, 11, 10, 13, 20, 18, 16, 14, 15, 17, 12, 10, 16, 18, 16, 14]], "caption": "Âge et temps de détection", "note": "Moyenne A = 67,12 ; moyenne T = 14,41 ; sA = 4,34 ; sT = 2,94 ; Cov(A,T) = 3,45."}};
let current=0;let answers=Array(questions.length).fill(null);let completed=false;
const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letter=i=>'ABCD'[i];
function renderQuestion(focus=false){const q=questions[current];$('question-card').innerHTML=`<div class="qtop"><span>QUESTION ${q.id} / 16</span><span>Exercice ${q.exercise} · ${escape(q.theme)}</span></div><h2 id="question-title" tabindex="-1">${escape(q.question)}</h2><fieldset><legend>Choisissez une seule réponse</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span class="letter">${letter(i)}</span><span class="option-text">${escape(o)}</span></label>`).join('')}</div></fieldset><button type="button" class="btn" id="clear-answer" style="margin-top:16px">Je ne sais pas / laisser sans réponse</button><div class="bottom"><button class="btn" id="prev" ${current===0?'disabled':''}>Précédente</button><button class="btn primary" id="next">${current===15?'Voir ma progression':'Question suivante'}</button></div>`;
$('question-card').querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[current]=Number(r.value);$('message').textContent='';renderProgress();}));$('clear-answer').onclick=()=>{answers[current]=null;renderQuestion(true);};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>{if(current<15)go(current+1);else{$('finish').scrollIntoView({behavior:'smooth',block:'center'});$('finish').focus();}};renderProgress();const c=cases[q.exercise];$('case-summary').textContent=c.summary;$('case-data').innerHTML=`<p>${escape(c.intro)}</p><div class="tablewrap"><table><caption>${escape(c.caption)}</caption><thead><tr><th scope="col">Groupe</th>${c.rows[0].slice(1).map((_,i)=>`<th scope="col">${i+1}</th>`).join('')}</tr></thead><tbody>${c.rows.map(row=>`<tr><th scope="row">${escape(row[0])}</th>${row.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${escape(c.note)}</p>`;if(focus)$('question-title').focus({preventScroll:true});}
function renderProgress(){let n=answers.filter(a=>a!==null).length;$('answered').textContent=`${n} réponse${n>1?'s':''} sur 16`;$('bar').style.width=`${n/16*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',n);$('question-nav').innerHTML=questions.map((q,i)=>`<button class="navq ${answers[i]!==null?'done':''}" aria-current="${i===current}" aria-label="Question ${i+1}, ${answers[i]!==null?'répondue':'sans réponse'}" data-q="${i}">${i+1}</button>`).join('');$('question-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.q)));}
function go(i){if(i<0||i>=16||completed)return;const changed=questions[i].exercise!==questions[current].exercise;current=i;renderQuestion(!changed);if(changed){$('statement-title').focus({preventScroll:true});$('statement-title').scrollIntoView({behavior:'smooth',block:'start'});}else{$('question-card').scrollIntoView({behavior:'smooth',block:'start'});}}
$('finish').onclick=()=>{completed=true;const score=answers.filter((a,i)=>a===questions[i].answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="card results-head"><div class="score">${score}<small> / 16</small></div><div><p class="eyebrow">Votre résultat</p><h2 id="results-title" tabindex="-1">${score===16?'Toutes les réponses sont correctes.':'Le corrigé pour comprendre vos réponses.'}</h2><p class="sub">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} · ${Math.round(score/16*100)} % de réussite.</p><div class="result-actions"><button class="btn primary" id="retry">Recommencer le QCM</button><button class="btn" id="print">Imprimer le corrigé</button></div></div></div>${questions.map((q,i)=>`<article class="card review"><p class="tag ${answers[i]===q.answer?'':'wrong'}">Question ${q.id} · ${answers[i]===null?'Sans réponse':answers[i]===q.answer?'Bonne réponse':'À revoir'}</p><h3>${escape(q.question)}</h3><p class="answer-line">${answers[i]===null?'<strong>Vous avez laissé cette question sans réponse.</strong>':`<strong>Votre réponse ${letter(answers[i])} :</strong> ${escape(q.options[answers[i]])}`}</p>${answers[i]!==q.answer?`<p class="answer-line"><strong>Bonne réponse ${letter(q.answer)} :</strong> ${escape(q.options[q.answer])}</p>`:''}<p class="explain">${escape(q.explanation)}</p></article>`).join('')}`;$('retry').onclick=()=>{answers=Array(16).fill(null);current=0;completed=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('message').textContent='';renderQuestion(true);window.scrollTo({top:0,behavior:'smooth'});};$('print').onclick=()=>window.print();$('results-title').focus();window.scrollTo({top:0,behavior:'smooth'});};renderQuestion();
</script><script>window.QCM_RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxxBUVfyHRBsVf62bA85YS2ykNneWUYAQp3bptzkI8snQRos3BcQqgDmh1Kvv2aCD_9/exec";
/* Suivi facultatif des tentatives, indépendant de l’hébergeur du QCM. */
(() => {
  const endpoint = window.QCM_RESULTS_ENDPOINT;
  if (!endpoint) return;
  let startedAt;
  let studentAlias = '';
  const quizPanel = document.getElementById('quiz');
  const welcome = document.createElement('section');
  welcome.className = 'card';
  welcome.id = 'welcome';
  welcome.innerHTML = `<h2>Avant de commencer</h2><p>Saisissez votre prénom et l'initiale de votre nom</p>
    <form id="start-form"><label for="start-alias">Votre nom</label><br><input id="start-alias" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px">
    
    <button class="btn primary" type="submit">Commencer le QCM</button><p id="start-error" role="status"></p></form>`;
  quizPanel.before(welcome);
  quizPanel.classList.add('hidden');
  welcome.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('start-alias');
    studentAlias = input.value.trim();
    if (studentAlias.length < 2 || /[\x00-\x1f\x7f]/.test(studentAlias)) { document.getElementById('start-error').textContent = 'Saisissez un nom valide (2 à 60 caractères).'; return; }
    startedAt = new Date().toISOString();
    welcome.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    document.getElementById('statement-title').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const finish = document.getElementById('finish');
  finish.addEventListener('click', () => {
    if (!completed) return;
    const attempt = {
      version: 1,
      quizId: 'qcm2-v1',
      attemptId: crypto.randomUUID(),
      startedAt,
      finishedAt: new Date().toISOString(),
      answers: answers.map((value, index) => ({questionId: questions[index].id, answer: value})),
    };
    const section = document.createElement('section');
    section.className = 'card';
    section.setAttribute('aria-labelledby', 'tracking-title');
    section.innerHTML = `<h2 id="tracking-title">Envoyer mes réponses pour voir ma note</h2>
      <p>Pour suivre votre progression, utilisez le même nom à chaque tentative. </p>
      <form id="tracking-form"><label for="student-alias">Votre nom</label><br>
      <input id="student-alias" name="alias" type="text" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn primary" type="submit">Envoyer mon résultat</button></div>
      <p id="tracking-status" role="status" aria-live="polite" style="margin-top:12px"></p></form>`;
    const resultPanel = document.getElementById('results');
    const correction = document.createElement('div');
    correction.className = 'hidden';
    correction.id = 'correction';
    while(resultPanel.firstChild) correction.appendChild(resultPanel.firstChild);
    resultPanel.append(section, correction);
    resultPanel.setAttribute('aria-labelledby', 'tracking-title');
    const omitted = answers.filter(a => a === null).length;
    const summary = document.createElement('p');
    summary.textContent = `${answers.length - omitted} réponse(s) renseignée(s), ${omitted} question(s) sans réponse. La note et le corrigé apparaîtront après l’envoi.`;
    section.querySelector('h2').after(summary);
    section.style.marginBottom = "24px";
    const form = section.querySelector('form');
    const status = section.querySelector('#tracking-status');
    const alias = section.querySelector('input');
    const button = section.querySelector('button');
    alias.value = studentAlias;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (alias.value.trim().length < 2) { status.textContent = 'Saisissez un nom d’au moins deux caractères.'; return; }
      button.disabled = true;
      alias.disabled = true;
      status.textContent = 'Envoi en cours…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...attempt, alias: alias.value.trim()}),
          signal: controller.signal,
          credentials: 'omit',
        });
        if (!response.ok) throw new Error('HTTP');
        const result = await response.json();
        if (result.ok !== true || result.attemptId !== attempt.attemptId) throw new Error('Unconfirmed');
        status.textContent = 'Votre résultat a bien été enregistré. Vous pouvez consulter le corrigé ci-dessous.';
        button.textContent = 'Résultat envoyé';
        correction.classList.remove('hidden');
        resultPanel.setAttribute('aria-labelledby', 'results-title');
        document.getElementById('results-title').focus();
      } catch (_) {
        status.textContent = 'L’enregistrement n’a pas pu être confirmé. La note et le corrigé restent masqués. Vous pouvez réessayer : cette tentative ne sera pas comptée deux fois.';
        button.disabled = false;
        alias.disabled = false;
        button.textContent = 'Réessayer l’envoi';
      } finally { clearTimeout(timeout); }
    });
    document.getElementById('tracking-title').setAttribute('tabindex', '-1');
    document.getElementById('tracking-title').focus();
    document.getElementById('retry').addEventListener('click', () => {
      quizPanel.classList.add('hidden');
      welcome.classList.remove('hidden');
      document.getElementById('start-alias').value = studentAlias;
      document.getElementById('start-alias').focus();
    });
  });
})();
</script></body></html>
